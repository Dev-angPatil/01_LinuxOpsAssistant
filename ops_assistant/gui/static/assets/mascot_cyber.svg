<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#cyberBg)" stroke="#8b5cf6" stroke-width="2"/>
  <!-- Head & Neck -->
  <circle cx="60" cy="58" r="26" fill="#fed7aa"/>
  <!-- Cyber Eye-patch / Scanner -->
  <rect x="60" y="50" width="20" height="10" rx="3" fill="#06b6d4" opacity="0.85"/>
  <line x1="60" y1="55" x2="80" y2="55" stroke="#ffffff" stroke-width="1"/>
  <!-- Left Eye -->
  <ellipse cx="48" cy="55" rx="3" ry="4" fill="#1e1b4b"/>
  <circle cx="49" cy="54" r="1.2" fill="#ffffff"/>
  <!-- Spiky Cyber Hair -->
  <path d="M32 50 Q40 24 60 22 Q80 24 88 50 Q75 35 60 36 Q45 35 32 50 Z" fill="url(#hairGrad)"/>
  <polygon points="40,32 46,16 52,30" fill="#06b6d4"/>
  <polygon points="52,28 60,12 68,28" fill="#8b5cf6"/>
  <polygon points="68,30 76,18 82,35" fill="#06b6d4"/>
  <!-- Jacket / Collar -->
  <path d="M34 84 L46 68 L74 68 L86 84 L80 106 L40 106 Z" fill="#18181b" stroke="#06b6d4" stroke-width="1.5"/>
  <!-- Cyber Tie / LED -->
  <polygon points="57,72 63,72 61,88 59,88" fill="#06b6d4"/>
</svg>